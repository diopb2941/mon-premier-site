        <section>
            <h1>Contactez-moi</h1>
            <p>Remplissez le formulaire ci-dessous pour toute demande de projet ou d'information.</p>
        </section>
        <sectio>
       <form action="#" method="POST" style="max-width: 600px; margin: 0 auto; padding: 20px; box-sizing: border-box;">

    <!-- 1. CAGE NOM COMPLET (Format normal en haut) -->
    <div style="margin-bottom: 20px; width: 100%;">
        <label for="nom" style="display: block; color: #000000; font-weight: bold; margin-bottom: 8px;">Nom complet :</label>
        <input type="text" id="nom" name="nom" required style="display: block !important; width: 100% !important; padding: 16px 20px !important; border: 2px solid #000000 !important; border-radius: 30px !important; background-color: #ffffff !important; box-sizing: border-box !important;">
    </div>

    <!-- 2. CAGE ADRESSE E-MAIL (Format normal en haut) -->
    <div style="margin-bottom: 25px; width: 100%;">
        <label for="email" style="display: block; color: #000000; font-weight: bold; margin-bottom: 8px;">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required style="display: block !important; width: 100% !important; padding: 16px 20px !important; border: 2px solid #000000 !important; border-radius: 30px !important; background-color: #ffffff !important; box-sizing: border-box !important;">
    </div>

    <!-- 3. CAGE VOTRE MESSAGE (Étendue horizontalement sur toute la largeur) -->
    <div style="margin-bottom: 30px; width: 100%;">
        <label for="message" style="display: block; color: #000000; font-weight: bold; margin-bottom: 8px;">Votre message :</label>
        <!-- padding et border-radius ajustés pour garder la forme ovale parfaite tout en restant large -->
        <textarea id="message" name="message" required style="display: block !important; width: 100% !important; padding: 25px !important; border: 2px solid #000000 !important; border-radius: 30px !important; background-color: #ffffff !important; box-sizing: border-box !important; min-height: 220px !important; resize: none;"></textarea>
    </div>

    <!-- BOUTON ENVOYER LE MESSAGE (Centré en bas) -->
    <div style="text-align: center; width: 100%;">
        <button type="submit" style="display: inline-block; width: 100%; max-width: 250px; padding: 15px; background-color: #3b82f6; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Envoyer le message</button>
    </div>

</form>
